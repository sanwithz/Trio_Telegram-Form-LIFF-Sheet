<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Send to Telegram & Save to Sheets</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gasparesganga-jquery-loading-overlay@2.1.7/dist/loadingoverlay.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');

    * {
        font-family: 'Sarabun', sans-serif;
}
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(0deg,rgba(255,180,0,.5) 0,rgba(255,180,0,0) 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }
        
        .form-title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        .file-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border: 2px dashed #667eea;
            border-radius: 12px;
            background: #f8f9ff;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .file-input-label:hover {
            background: #667eea;
            color: white;
        }
        
        .file-icon {
            margin-right: 10px;
            font-size: 20px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .required {
            color: #e74c3c;
        }
        
        .file-name {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            font-style: italic;
        }
        
        .image-preview {
            margin-top: 15px;
            text-align: center;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #e1e5e9;
        }
        
        .remove-image {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        .remove-image:hover {
            background: #c82333;
            transform: translateY(-1px);
        }
        
        @media (max-width: 600px) {
            .form-container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .form-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 class="form-title">📧 Contact Us</h1>
        
        <form id="uploadForm" onsubmit="return sender()">
            <div class="form-group">
                <label for="name" class="form-label">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" class="form-input" required placeholder="Enter your full name">
            </div>
            
            <div class="form-group">
                <label for="email" class="form-label">Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="Enter your email address">
            </div>
            
            <div class="form-group">
                <label for="msg" class="form-label">Message <span class="required">*</span></label>
                <textarea id="msg" name="message" class="form-input form-textarea" required placeholder="Write your message here..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="image" class="form-label">Attach Image (Optional)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="image" name="image" class="file-input" accept="image/*" onchange="updateFileName(this)">
                    <label for="image" class="file-input-label">
                        <span class="file-icon">📎</span>
                        <span>Choose an image to attach</span>
                    </label>
                </div>
                <div id="fileName" class="file-name"></div>
                <div id="imagePreview" class="image-preview"></div>
            </div>
            
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

    <script>
        // Configuration
        var telegram_bot_id = "7150766362:AAFjqbrzAEhvq3N3PtzxOLp1rWBydGxUccM";
        var chat_id = "6796212791";
        var google_script_url = "https://script.google.com/macros/s/AKfycbzkghvCrOV-kyB3Twn1ZXqxyzGTvP6RkMeuT67hTLtmJqOkZIrT5K50PvWBC_QLq4FyhA/exec";
        
        // Function to update file name display and show preview
        function updateFileName(input) {
            const fileName = document.getElementById('fileName');
            const imagePreview = document.getElementById('imagePreview');
            
            if (input.files && input.files[0]) {
                const file = input.files[0];
                fileName.textContent = `Selected: ${file.name}`;
                fileName.style.color = '#28a745';
                
                // Create image preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.innerHTML = `
                        <img src="${e.target.result}" alt="Preview" class="preview-image">
                        <br>
                        <button type="button" class="remove-image" onclick="removeImage()">
                            🗑️ Remove Image
                        </button>
                    `;
                };
                reader.readAsDataURL(file);
            } else {
                fileName.textContent = '';
                imagePreview.innerHTML = '';
            }
        }
        
        // Function to remove selected image
        function removeImage() {
            document.getElementById('image').value = '';
            document.getElementById('fileName').textContent = '';
            document.getElementById('imagePreview').innerHTML = '';
        }
        
        // Function to save data to Google Sheets
        function saveToGoogleSheets(formData, imageBase64 = null) {
            return new Promise((resolve, reject) => {
                const sheetData = new FormData();
                sheetData.append('name', formData.get('name'));
                sheetData.append('email', formData.get('email'));
                sheetData.append('message', formData.get('message'));
                
                if (imageBase64) {
                    sheetData.append('image', imageBase64);
                }
                
                $.ajax({
                    url: google_script_url,
                    method: 'POST',
                    data: sheetData,
                    processData: false,
                    contentType: false
                }).done(function(response) {
                    resolve(response);
                }).fail(function(error) {
                    reject(error);
                });
            });
        }
        
        // Main sender function
        var sender = function() {
            // Show loading overlay
            $.LoadingOverlay("show", {
                text: "Sending your message...",
                background: "rgba(102, 126, 234, 0.8)"
            });
            
            // Create form data
            var formData = new FormData(document.getElementById("uploadForm"));
            formData.append("chat_id", chat_id);
            
            // Check if image is selected
            const imageFile = document.getElementById("image").files[0];
            let imageBase64 = null;
            
            // Create caption with form data
            const caption = `📋 New Contact Form Submission\n\n` +
                          `👤 Name: ${formData.get("name")}\n` +
                          `📧 Email: ${formData.get("email")}\n` +
                          `💬 Message: ${formData.get("message")}`;
            
            // Function to send to Telegram
            function sendToTelegram() {
                if (imageFile) {
                    formData.append("photo", imageFile);
                }
                formData.append("caption", caption);
                
                // Determine API endpoint based on whether image is attached
                const apiEndpoint = imageFile ? "/sendPhoto" : "/sendMessage";
                const apiUrl = `https://api.telegram.org/bot${telegram_bot_id}${apiEndpoint}`;
                
                // If no image, use sendMessage instead
                if (!imageFile) {
                    const textFormData = new FormData();
                    textFormData.append("chat_id", chat_id);
                    textFormData.append("text", caption);
                    formData = textFormData;
                }
                
                return $.ajax({
                    url: apiUrl,
                    method: "POST",
                    processData: false,
                    contentType: false,
                    data: formData
                });
            }
            
            // Function to handle image conversion for Google Sheets
            function processImage() {
                return new Promise((resolve) => {
                    if (imageFile) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            imageBase64 = e.target.result;
                            resolve();
                        };
                        reader.readAsDataURL(imageFile);
                    } else {
                        resolve();
                    }
                });
            }
            
            // Process image first, then send to both services
            processImage().then(() => {
                // Send to both Telegram and Google Sheets simultaneously
                Promise.all([
                    sendToTelegram(),
                    saveToGoogleSheets(formData, imageBase64)
                ]).then((responses) => {
                    // Hide loading overlay
                    $.LoadingOverlay("hide");
                    
                    // Show success message
                    Swal.fire({
                        icon: "success",
                        title: "Message Sent! 🎉",
                        text: "Your message has been sent via Telegram and saved to our records.",
                        confirmButtonColor: "#28a745",
                        confirmButtonText: "Great!"
                    });
                    
                    // Clear form
                    document.getElementById("name").value = "";
                    document.getElementById("email").value = "";
                    document.getElementById("msg").value = "";
                    document.getElementById("image").value = "";
                    document.getElementById("fileName").textContent = "";
                    document.getElementById("imagePreview").innerHTML = "";
                    
                }).catch((error) => {
                    // Hide loading overlay
                    $.LoadingOverlay("hide");
                    
                    // Show error message
                    Swal.fire({
                        icon: "error",
                        title: "Oops! Something went wrong 😔",
                        text: "There was an issue processing your request. Please try again.",
                        confirmButtonColor: "#dc3545",
                        confirmButtonText: "Try Again"
                    });
                    
                    console.error("Error details:", error);
                });
            });
            
            // Prevent default form submission
            return false;
        };
    </script>
</body>
</html>
