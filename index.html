<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact Form - Send to Telegram & Save to Sheets</title>

  <!-- jQuery + Loading overlay + SweetAlert -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gasparesganga-jquery-loading-overlay@2.1.7/dist/loadingoverlay.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    /* your CSS (unchanged) */
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');
    *{box-sizing:border-box;font-family:'Sarabun',sans-serif}
    body{background:linear-gradient(0deg,rgba(255,180,0,.5) 0,rgba(255,180,0,0) 70%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .form-container{background:#fff;padding:40px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.1);width:100%;max-width:500px;backdrop-filter:blur(10px)}
    .form-title{text-align:center;color:#333;margin-bottom:30px;font-size:28px;font-weight:600}
    .form-group{margin-bottom:25px}.form-label{display:block;margin-bottom:8px;color:#555;font-weight:500;font-size:14px}
    .form-input{width:100%;padding:15px;border:2px solid #e1e5e9;border-radius:12px;font-size:16px;background:#f8f9fa}
    .form-input:focus{outline:none;border-color:#667eea;background:#fff;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
    .form-textarea{resize:vertical;min-height:120px;font-family:inherit}
    .file-input-wrapper{position:relative;display:inline-block;width:100%}
    .file-input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer}
    .file-input-label{display:flex;align-items:center;justify-content:center;padding:15px;border:2px dashed #667eea;border-radius:12px;background:#f8f9ff;color:#667eea;cursor:pointer;font-weight:500}
    .file-name{margin-top:10px;font-size:14px;color:#666;font-style:italic}
    .image-preview{margin-top:15px;text-align:center}
    .preview-image{max-width:100%;max-height:200px;border-radius:12px;border:2px solid #e1e5e9;box-shadow:0 4px 15px rgba(0,0,0,.1)}
    .remove-image{display:inline-block;margin-top:10px;padding:8px 16px;background:#dc3545;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px}
    .submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
    .required{color:#e74c3c}
    @media (max-width:600px){.form-container{padding:30px 20px;margin:10px}.form-title{font-size:24px}}
  </style>
</head>
<body>
  <div class="form-container">
    <h1 class="form-title">📧 Contact Us</h1>

    <form id="uploadForm">
      <!-- (your form fields unchanged) -->
      <div class="form-group">
        <label class="form-label">Full Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" class="form-input" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label class="form-label">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" class="form-input" required placeholder="Enter your email address">
      </div>

      <div class="form-group">
        <label class="form-label">Message <span class="required">*</span></label>
        <textarea id="msg" name="message" class="form-input form-textarea" required placeholder="Write your message here..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Attach Image (Optional)</label>
        <div class="file-input-wrapper">
          <input type="file" id="image" name="image" class="file-input" accept="image/*" onchange="updateFileName(this)">
          <label for="image" class="file-input-label"><span class="file-icon">📎</span><span>Choose an image to attach</span></label>
        </div>
        <div id="fileName" class="file-name"></div>
        <div id="imagePreview" class="image-preview"></div>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </div>

  <script>
    // --- CONFIG: set these ---
    const TELEGRAM_BOT_ID = "7150766362:AAFjqbrzAEhvq3N3PtzxOLp1rWBydGxUccM";
    const TELEGRAM_CHAT_ID = "6796212791";
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxSEKGLvbzB1J-AIsAQOODWFqUNMXCmivESsTZjLSZiGPQMXN0mp4aO5TAMZcDlJgWlA/exec";
    const LIFF_ID = "2007125937-lDymrd1P"; // <<< REPLACE with your LIFF ID

    // --- LIFF init & helper (FORCE LOGIN ON PAGE LOAD) ---
    let liffInitDone = false;
    async function initLiffAndForceLogin() {
      try {
        await liff.init({ liffId: LIFF_ID });
        liffInitDone = true;

        // If not logged in, force login ONCE.
        // Use sessionStorage to avoid redirect loops while testing.
        if (!liff.isLoggedIn()) {
          if (!sessionStorage.getItem('liffLoginTried')) {
            sessionStorage.setItem('liffLoginTried', '1');
            // Optional: you can pass {redirectUri: location.href} if desired.
            liff.login();
            // liff.login() redirects and will stop further JS execution.
          } else {
            console.warn('LIFF login attempted previously; skipping to prevent loop.');
          }
        }
      } catch (err) {
        console.warn("LIFF init failed — continuing without LINE profile. Error:", err);
        liffInitDone = false;
      }
    }

    // returns object { userId, displayName, pictureUrl } or null
    async function getLineProfileSafe() {
      if (!liffInitDone) return null;
      try {
        const profile = await liff.getProfile();
        return {
          userId: profile.userId || "",
          displayName: profile.displayName || "",
          pictureUrl: profile.pictureUrl || ""
        };
      } catch (err) {
        console.warn("Could not get LINE profile:", err);
        return null;
      }
    }

    // file preview helpers (same as before)
    function updateFileName(input) {
      const fileName = document.getElementById('fileName');
      const imagePreview = document.getElementById('imagePreview');
      if (input.files && input.files[0]) {
        const file = input.files[0];
        fileName.textContent = `Selected: ${file.name}`;
        fileName.style.color = '#28a745';

        const reader = new FileReader();
        reader.onload = function(e) {
          imagePreview.innerHTML = `
            <img src="${e.target.result}" alt="Preview" class="preview-image"><br>
            <button type="button" class="remove-image" onclick="removeImage()">🗑️ Remove Image</button>
          `;
        };
        reader.readAsDataURL(file);
      } else {
        fileName.textContent = '';
        imagePreview.innerHTML = '';
      }
    }
    function removeImage() {
      document.getElementById('image').value = '';
      document.getElementById('fileName').textContent = '';
      document.getElementById('imagePreview').innerHTML = '';
    }

    // Save to Google Sheets via your Apps Script; sends name,email,message,image(base64),line_id,line_name
    function saveToGoogleSheets(formDataObj) {
      return new Promise((resolve, reject) => {
        const sheetForm = new FormData();
        for (const k in formDataObj) {
          if (formDataObj[k] !== null && formDataObj[k] !== undefined) sheetForm.append(k, formDataObj[k]);
        }
        $.ajax({
          url: GOOGLE_SCRIPT_URL,
          method: 'POST',
          data: sheetForm,
          processData: false,
          contentType: false
        }).done(resolve).fail(reject);
      });
    }

    // Send to Telegram (same)
    function sendToTelegram({ captionText, imageFile }) {
      return new Promise((resolve, reject) => {
        if (imageFile) {
          const tgForm = new FormData();
          tgForm.append("chat_id", TELEGRAM_CHAT_ID);
          tgForm.append("caption", captionText);
          tgForm.append("photo", imageFile, imageFile.name);
          $.ajax({
            url: `https://api.telegram.org/bot${TELEGRAM_BOT_ID}/sendPhoto`,
            method: "POST",
            data: tgForm,
            processData: false,
            contentType: false
          }).done(resolve).fail(reject);
        } else {
          const tgForm = new FormData();
          tgForm.append("chat_id", TELEGRAM_CHAT_ID);
          tgForm.append("text", captionText);
          $.ajax({
            url: `https://api.telegram.org/bot${TELEGRAM_BOT_ID}/sendMessage`,
            method: "POST",
            data: tgForm,
            processData: false,
            contentType: false
          }).done(resolve).fail(reject);
        }
      });
    }

    // sender (awaits profile)
    async function sender(event) {
      event.preventDefault();
      $.LoadingOverlay("show", { text: "Sending your message...", background: "rgba(102,126,234,0.8)" });
      try {
        // ensure LIFF init done — if login redirected, this code won't run until return
        if (!liffInitDone) await initLiffAndForceLogin();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const message = document.getElementById("msg").value.trim();
        const imageInput = document.getElementById("image");
        const imageFile = imageInput.files && imageInput.files[0] ? imageInput.files[0] : null;

        const lineProfile = await getLineProfileSafe();
        const line_id = lineProfile ? lineProfile.userId : "";
        const line_name = lineProfile ? lineProfile.displayName : "";
        const line_pic = lineProfile ? lineProfile.pictureUrl : "";

        let caption = `📋 New Contact Form Submission\n\n👤 Name: ${name}\n📧 Email: ${email}\n💬 Message: ${message}`;
        if (line_id || line_name) caption += `\n\n🔗 LINE ID: ${line_id}\n📝 LINE Name: ${line_name}`;

        let imageBase64 = null;
        if (imageFile) {
          imageBase64 = await new Promise((res, rej) => {
            const reader = new FileReader();
            reader.onload = () => res(reader.result);
            reader.onerror = () => rej("Image read failed");
            reader.readAsDataURL(imageFile);
          });
        }

        const sheetPayload = { name, email, message, image: imageBase64 || "", line_id, line_name };

        await Promise.all([
          sendToTelegram({ captionText: caption, imageFile }),
          saveToGoogleSheets(sheetPayload)
        ]);

        $.LoadingOverlay("hide");
        Swal.fire({ icon: "success", title: "Message Sent! 🎉", text: "Your message has been sent via Telegram and saved to our records.", confirmButtonColor: "#28a745", confirmButtonText: "Great!" });

        document.getElementById("uploadForm").reset();
        document.getElementById("fileName").textContent = "";
        document.getElementById("imagePreview").innerHTML = "";

      } catch (err) {
        $.LoadingOverlay("hide");
        console.error("Error sending:", err);
        Swal.fire({ icon: "error", title: "Oops! Something went wrong 😔", text: "There was an issue processing your request. Please try again.", confirmButtonColor: "#dc3545", confirmButtonText: "Try Again" });
      }
      return false;
    }

    // attach handler once DOM loaded
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById("uploadForm").addEventListener("submit", sender);
      // initialise and force login immediately on page load
      initLiffAndForceLogin();
    });
  </script>
</body>
</html>
